version: '3.8'

services:
  # Base de Datos MySQL (Alojada en EC2 si no se utiliza RDS)
  mysql-db:
    image: mysql:8.0
    container_name: mesatech-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootSecurePassword2026!
      MYSQL_DATABASE: mesatech_solicitudes_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - mesatech-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Microservicio 1: Solicitudes (Puerto 8081)
  mesatech-solicitudes:
    build:
      context: ../../mesatech-solicitudes
      dockerfile: Dockerfile
    container_name: mesatech-solicitudes
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/mesatech_solicitudes_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: RootSecurePassword2026!
    ports:
      - "8081:8081"
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - mesatech-net

  # Microservicio 2: Catálogo (Puerto 8082)
  mesatech-catalogo:
    build:
      context: ../../mesatech-catalogo
      dockerfile: Dockerfile
    container_name: mesatech-catalogo
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/mesatech_catalogo_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: RootSecurePassword2026!
    ports:
      - "8082:8082"
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - mesatech-net

  # Backend for Frontend (BFF) (Puerto 8080)
  mesatech-bff:
    build:
      context: ../../mesatech-bff
      dockerfile: Dockerfile
    container_name: mesatech-bff
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-your-tenant-id}
      AZURE_ISSUER_URI: https://login.microsoftonline.com/${AZURE_TENANT_ID:-your-tenant-id}/v2.0
      AZURE_AUDIENCE: api://api-cloud-native
      SERVICES_SOLICITUDES_URL: http://mesatech-solicitudes:8081
      SERVICES_CATALOGO_URL: http://mesatech-catalogo:8082
    ports:
      - "8080:8080"
    depends_on:
      - mesatech-solicitudes
      - mesatech-catalogo
    networks:
      - mesatech-net

networks:
  mesatech-net:
    driver: bridge

volumes:
  mysql_data:
