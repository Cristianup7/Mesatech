server.port=8080
spring.application.name=mesatech-bff

# Microsoft Entra ID (Azure AD) - OAuth2 Resource Server
# Configuración del tenant y audiencia requeridos por el caso de negocio
azure.tenant-id=${AZURE_TENANT_ID:common}
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${azure.tenant-id}/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=api://api-cloud-native

# URLs de Microservicios Internos (Enrutamiento del BFF sin acceso directo a BD)
services.solicitudes.url=${SERVICES_SOLICITUDES_URL:http://localhost:8081}
services.catalogo.url=${SERVICES_CATALOGO_URL:http://localhost:8082}

# Configuración de CORS para permitir SPA en React
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://mesatech.cloud}
