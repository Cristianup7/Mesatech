server.port=8082
spring.application.name=mesatech-catalogo

# Base de datos H2 en modo MySQL para desarrollo local y pruebas
spring.datasource.url=jdbc:h2:mem:mesatech_catalogo_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
